[package]
name = "boombox-rs"
version = "3.8.0"
edition = "2021"
authors = ["Nguyễn Trần Duy Hưng <hung23012@gmail.com>"]
description = "A retro cyberpunk cassette boombox music player and radio explorer in pure Rust"
license = "GPL-3.0-or-later"

[[bin]]
name = "boombox-rs"
path = "src/main.rs"

[dependencies]
# TUI & Terminal
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Async & Concurrency
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"

# Audio & DSP
rustfft = "6.2"

# Networking & Web APIs
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
urlencoding = "2.1"

# System & Desktop
dirs = "5.0"
unicode-width = "0.1"
regex = "1.10"
rand = "0.8"
lofty = "0.25.1"
ksni = "0.3.6"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
