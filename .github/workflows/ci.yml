name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libasound2-dev
      - run: cargo check --all-targets
      - run: cargo test --lib --bins --verbose
      - run: cargo build --release

      - name: Package Windows Release Archive
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "boombox-rs-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "target/release/boombox-rs.exe" -Destination "$dist\boombox-rs.exe"
          Copy-Item "install.bat" -Destination "$dist\install.bat"
          Copy-Item "install.ps1" -Destination "$dist\install.ps1"
          if (Test-Path "Windows/boombox-rs-windows-x86_64/RUN-BOOMBOX.bat") {
            Copy-Item "Windows/boombox-rs-windows-x86_64/RUN-BOOMBOX.bat" -Destination "$dist\RUN-BOOMBOX.bat"
          }
          if (Test-Path "Windows/boombox-rs-windows-x86_64/README-PORTABLE.txt") {
            Copy-Item "Windows/boombox-rs-windows-x86_64/README-PORTABLE.txt" -Destination "$dist\README-PORTABLE.txt"
          }
          Compress-Archive -Path "$dist\*" -DestinationPath "boombox-rs-windows-x86_64.zip" -Force

      - name: Package Linux Release Archive
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: |
          strip target/release/boombox-rs
          tar -czf boombox-rs-linux-x86_64.tar.gz -C target/release boombox-rs

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boombox-rs-windows-x86_64.zip
            boombox-rs-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
