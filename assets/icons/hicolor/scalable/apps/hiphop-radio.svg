<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e283d"/>
      <stop offset="60%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </radialGradient>

    <!-- Neon Accents -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>

    <linearGradient id="neon-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd24d"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>

    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe899"/>
      <stop offset="50%" stop-color="#f5b82e"/>
      <stop offset="100%" stop-color="#b37700"/>
    </linearGradient>

    <linearGradient id="tape-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a2612"/>
      <stop offset="50%" stop-color="#6e391b"/>
      <stop offset="100%" stop-color="#3b1d0e"/>
    </linearGradient>

    <linearGradient id="cassette-chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#neon-cyan)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Outer Neon Pulse Glow Ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#neon-amber)" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- CASSETTE SHELL (Main Body) -->
  <g filter="url(#drop-shadow)">
    <!-- Chassis Outer Contour -->
    <path d="M 64 120 
             C 64 96, 80 84, 104 84 
             L 408 84 
             C 432 84, 448 96, 448 120 
             L 448 376 
             C 448 400, 432 412, 408 412 
             L 374 412 
             L 354 436 
             L 158 436 
             L 138 412 
             L 104 412 
             C 80 412, 64 400, 64 376 Z" 
          fill="url(#cassette-chassis)" 
          stroke="#2f3b52" 
          stroke-width="3.5"/>

    <!-- Top Chassis Notch Details -->
    <rect x="110" y="84" width="36" height="8" rx="2" fill="#0d111a"/>
    <rect x="366" y="84" width="36" height="8" rx="2" fill="#0d111a"/>
    <rect x="236" y="84" width="40" height="6" rx="2" fill="#0d111a"/>

    <!-- Corner Screws -->
    <circle cx="82" cy="104" r="5.5" fill="#3a4863" stroke="#161c28" stroke-width="1.5"/>
    <line x1="79" y1="104" x2="85" y2="104" stroke="#161c28" stroke-width="1.5"/>
    <circle cx="430" cy="104" r="5.5" fill="#3a4863" stroke="#161c28" stroke-width="1.5"/>
    <line x1="427" y1="104" x2="433" y2="104" stroke="#161c28" stroke-width="1.5"/>
    <circle cx="82" cy="392" r="5.5" fill="#3a4863" stroke="#161c28" stroke-width="1.5"/>
    <line x1="79" y1="392" x2="85" y2="392" stroke="#161c28" stroke-width="1.5"/>
    <circle cx="430" cy="392" r="5.5" fill="#3a4863" stroke="#161c28" stroke-width="1.5"/>
    <line x1="427" y1="392" x2="433" y2="392" stroke="#161c28" stroke-width="1.5"/>
    <circle cx="256" cy="422" r="4.5" fill="#3a4863" stroke="#161c28" stroke-width="1.5"/>

    <!-- CASSETTE LABEL AREA -->
    <rect x="88" y="112" width="336" height="216" rx="14" fill="#141a24" stroke="#252f42" stroke-width="2"/>

    <!-- Cyberpunk Synthwave Stripes on Label -->
    <path d="M 88 132 L 424 132 L 424 140 L 88 140 Z" fill="url(#neon-cyan)"/>
    <path d="M 88 144 L 424 144 L 424 148 L 88 148 Z" fill="url(#neon-amber)"/>
    <path d="M 88 152 L 424 152 L 424 154 L 88 154 Z" fill="#33ff33" opacity="0.8"/>

    <!-- Label Typography & Badges -->
    <text x="104" y="174" font-family="monospace, 'JetBrains Mono', sans-serif" font-weight="900" font-size="19" fill="#ffd24d" letter-spacing="2">BOOMBOX</text>
    <text x="214" y="174" font-family="monospace, 'JetBrains Mono', sans-serif" font-weight="900" font-size="19" fill="#00f5ff" letter-spacing="1">RX-505</text>
    <text x="336" y="174" font-family="monospace, 'JetBrains Mono', sans-serif" font-weight="700" font-size="12" fill="#33ff33" letter-spacing="1">STEREO</text>

    <rect x="104" y="184" width="70" height="14" rx="3" fill="#0a0e17" stroke="#334460" stroke-width="1"/>
    <text x="110" y="195" font-family="monospace, sans-serif" font-size="8.5" font-weight="700" fill="#a0aec0">DOLBY B-C</text>

    <rect x="180" y="184" width="62" height="14" rx="3" fill="#0a0e17" stroke="#334460" stroke-width="1"/>
    <text x="186" y="195" font-family="monospace, sans-serif" font-size="8.5" font-weight="700" fill="#a0aec0">TYPE II CrO2</text>

    <rect x="372" y="184" width="40" height="14" rx="3" fill="#0a0e17" stroke="#ff3366" stroke-width="1"/>
    <text x="378" y="195" font-family="monospace, sans-serif" font-size="9" font-weight="900" fill="#ff3366">C-90</text>

    <!-- CASSETTE WINDOW (Smoked Glass) -->
    <rect x="124" y="208" width="264" height="106" rx="14" fill="#080b12" stroke="#00f5ff" stroke-width="2.5" stroke-opacity="0.85" filter="url(#glow-cyan)"/>

    <!-- Center Ruler / Gauge Lines on Window -->
    <line x1="256" y1="214" x2="256" y2="230" stroke="#334460" stroke-width="2"/>
    <line x1="236" y1="218" x2="236" y2="226" stroke="#253247" stroke-width="1.5"/>
    <line x1="246" y1="218" x2="246" y2="226" stroke="#253247" stroke-width="1.5"/>
    <line x1="266" y1="218" x2="266" y2="226" stroke="#253247" stroke-width="1.5"/>
    <line x1="276" y1="218" x2="276" y2="226" stroke="#253247" stroke-width="1.5"/>
    <text x="249" y="240" font-family="monospace, sans-serif" font-size="8" fill="#6f7e91" font-weight="700">100 50 0</text>

    <!-- Magnetic Tape Packs around Spools -->
    <!-- Left Tape Pack (Large reel) -->
    <circle cx="184" cy="261" r="39" fill="url(#tape-ribbon)" stroke="#221108" stroke-width="1.5"/>
    <!-- Right Tape Pack (Smaller reel) -->
    <circle cx="328" cy="261" r="31" fill="url(#tape-ribbon)" stroke="#221108" stroke-width="1.5"/>
    <!-- Tape bridge connecting the two -->
    <path d="M 184 300 L 328 292" stroke="#4a2612" stroke-width="6"/>

    <!-- SPOOL HUBS (Precision Gear Wheels) -->
    <!-- Left Spool -->
    <g transform="translate(184, 261)">
      <circle cx="0" cy="0" r="23" fill="url(#gold-metal)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="12" fill="#080b12" stroke="#d48800" stroke-width="1.5"/>
      <!-- Spool Teeth (6 teeth) -->
      <rect x="-2.5" y="-19" width="5" height="7" rx="1" fill="#ffffff"/>
      <rect x="-2.5" y="12" width="5" height="7" rx="1" fill="#ffffff"/>
      <rect x="-2.5" y="-19" width="5" height="7" rx="1" fill="#ffffff" transform="rotate(60)"/>
      <rect x="-2.5" y="12" width="5" height="7" rx="1" fill="#ffffff" transform="rotate(60)"/>
      <rect x="-2.5" y="-19" width="5" height="7" rx="1" fill="#ffffff" transform="rotate(120)"/>
      <rect x="-2.5" y="12" width="5" height="7" rx="1" fill="#ffffff" transform="rotate(120)"/>
      <!-- Glowing Center Accent -->
      <circle cx="0" cy="0" r="4" fill="#00f5ff" filter="url(#glow-cyan)"/>
    </g>

    <!-- Right Spool -->
    <g transform="translate(328, 261)">
      <circle cx="0" cy="0" r="23" fill="url(#gold-metal)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="12" fill="#080b12" stroke="#d48800" stroke-width="1.5"/>
      <!-- Spool Teeth (6 teeth) -->
      <rect x="-2.5" y="-19" width="5" height="7" rx="1" fill="#ffffff"/>
      <rect x="-2.5" y="12" width="5" height="7" rx="1" fill="#ffffff"/>
      <rect x="-2.5" y="-19" width="5" height="7" rx="1" fill="#ffffff" transform="rotate(60)"/>
      <rect x="-2.5" y="12" width="5" height="7" rx="1" fill="#ffffff" transform="rotate(60)"/>
      <rect x="-2.5" y="-19" width="5" height="7" rx="1" fill="#ffffff" transform="rotate(120)"/>
      <rect x="-2.5" y="12" width="5" height="7" rx="1" fill="#ffffff" transform="rotate(120)"/>
      <!-- Glowing Center Accent -->
      <circle cx="0" cy="0" r="4" fill="#00f5ff" filter="url(#glow-cyan)"/>
    </g>

    <!-- BOTTOM CASSETTE TRAPEZOID AREA (Tape Head Bay) -->
    <polygon points="144,342 368,342 352,428 160,428" fill="#10141e" stroke="#252f42" stroke-width="2.5"/>

    <!-- Tape Head & Roller Holes -->
    <!-- Left Roller Pin & Guide -->
    <circle cx="180" cy="385" r="8" fill="#080b12" stroke="#334460" stroke-width="1.5"/>
    <circle cx="180" cy="385" r="4" fill="#ffd24d"/>
    <circle cx="214" cy="406" r="4.5" fill="#080b12"/>

    <!-- Center Magnetic Head Cutout -->
    <rect x="238" y="366" width="36" height="38" rx="4" fill="#080b12" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Head Core Coil -->
    <rect x="246" y="374" width="20" height="22" rx="2" fill="#ffd24d"/>
    <line x1="256" y1="374" x2="256" y2="396" stroke="#080b12" stroke-width="2"/>

    <!-- Right Roller Pin & Guide -->
    <circle cx="298" cy="406" r="4.5" fill="#080b12"/>
    <circle cx="332" cy="385" r="8" fill="#080b12" stroke="#334460" stroke-width="1.5"/>
    <circle cx="332" cy="385" r="4" fill="#ffd24d"/>
  </g>

  <!-- Cyberpunk Soundwave / Neon Audio Pulse Indicator along top -->
  <g transform="translate(180, 52)" opacity="0.9">
    <rect x="0" y="8" width="4" height="12" rx="2" fill="#33ff33"/>
    <rect x="8" y="4" width="4" height="16" rx="2" fill="#33ff33"/>
    <rect x="16" y="0" width="4" height="20" rx="2" fill="#00f5ff"/>
    <rect x="24" y="6" width="4" height="14" rx="2" fill="#00f5ff"/>
    <rect x="32" y="2" width="4" height="18" rx="2" fill="#ffd24d"/>
    <rect x="40" y="8" width="4" height="12" rx="2" fill="#ffd24d"/>
    <rect x="48" y="4" width="4" height="16" rx="2" fill="#ff3366"/>
    <rect x="56" y="10" width="4" height="10" rx="2" fill="#ff3366"/>
    <rect x="64" y="2" width="4" height="18" rx="2" fill="#00f5ff"/>
    <rect x="72" y="6" width="4" height="14" rx="2" fill="#33ff33"/>
    <rect x="80" y="0" width="4" height="20" rx="2" fill="#33ff33"/>
    <rect x="88" y="8" width="4" height="12" rx="2" fill="#ffd24d"/>
    <rect x="96" y="4" width="4" height="16" rx="2" fill="#ffd24d"/>
    <rect x="104" y="2" width="4" height="18" rx="2" fill="#00f5ff"/>
    <rect x="112" y="8" width="4" height="12" rx="2" fill="#ff3366"/>
    <rect x="120" y="4" width="4" height="16" rx="2" fill="#33ff33"/>
    <rect x="128" y="10" width="4" height="10" rx="2" fill="#33ff33"/>
    <rect x="136" y="2" width="4" height="18" rx="2" fill="#00f5ff"/>
    <rect x="144" y="6" width="4" height="14" rx="2" fill="#ffd24d"/>
  </g>
</svg>
